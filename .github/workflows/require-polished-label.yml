name: polished

on:
  pull_request:
    types:
      - opened
      - synchronize
      - labeled
      - unlabeled
      - ready_for_review
      - reopened
      - converted_to_draft
    branches: [main]

permissions:
  pull-requests: read

concurrency:
  group: polished-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  polished:
    name: polished
    runs-on: ubuntu-latest
    steps:
      - name: polished
        env:
          LABEL_NAMES: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          if ! printf '%s\n' "$LABEL_NAMES" | jq -e 'index("polished") != null' >/dev/null; then
            echo "::error::PR needs the 'polished' label"
            exit 1
          fi
