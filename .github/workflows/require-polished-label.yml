name: polished

on:
  pull_request:
    types:
      - opened
      - synchronize
      - labeled
      - unlabeled
      - ready_for_review
      - reopened
      - converted_to_draft
    branches: [main]

permissions:
  pull-requests: read

concurrency:
  group: polished-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  polished:
    name: polished
    runs-on: ubuntu-latest
    steps:
      - name: polished
        env:
          LABEL_NAMES: ${{ toJson(github.event.pull_request.labels.*.name) }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if ! printf '%s\n' "$LABEL_NAMES" | jq -e 'index("polished") != null' >/dev/null; then
            echo "::error::PR needs the 'polished' label"
            exit 1
          fi
          actor=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/events" --jq '.[] | select(.event == "labeled" and .label.name == "polished") | .actor.login' | tail -n 1)
          if [ "$actor" != "GoddyB" ]; then
            echo "::error::Only GoddyB may add the polished label"
            exit 1
          fi
